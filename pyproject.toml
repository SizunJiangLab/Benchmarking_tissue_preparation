[project]
name = "benchmarking-tissue-preparation"
version = "0.1.0"
description = "Analysis workflows benchmarking tissue preparation and staining conditions for multiplexed imaging of FFPE tissue"
readme = "README.md"
license = "MIT"
# tensorflow 2.8 (required by deepcell 0.12) stops at Python 3.10; anndata 0.11 needs 3.10.
requires-python = ">=3.10,<3.11"
dependencies = [
    "deepcell==0.12.10",
    "imagecodecs==2024.6.1",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scikit-image==0.24.0",
    "tensorflow==2.8.4",
]

[project.optional-dependencies]
# manual_annotation/ (pip install ".[annotation]"). Versions as of 2026-06-12, the
# last analysis change to that folder.
annotation = [
    "anndata==0.11.4",
    "geopandas==1.1.3",
    "ipython==8.39.0",
    "matplotlib==3.10.9",
    "scanpy==1.11.5",
    "svgutils==0.3.4",
    "tifffile==2025.5.10",
    "tqdm==4.68.2",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# The repository is a set of scripts, not an importable package.
[tool.setuptools]
packages = []
py-modules = []
